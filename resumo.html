<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#002395">
<title>Resumo — Prevenção de Perdas</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--b1:#002395;--b2:#00155A;--y1:#FFD100}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#eef1f6;color:#0f172a;padding-bottom:80px}
.top{background:linear-gradient(135deg,var(--b2),var(--b1));color:#fff;padding:16px 16px 20px;position:sticky;top:0;z-index:30;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.top .brand{display:flex;align-items:center;gap:10px}
.top .brand img{height:34px;width:auto;border-radius:6px;background:#fff;padding:2px}
.top .brand .tt{font-weight:800;font-size:17px;line-height:1.1}
.top .sub{font-size:12px;opacity:.9;margin-top:2px}
.top .meta{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:12px}
.top .u{background:rgba(255,255,255,.15);padding:5px 10px;border-radius:20px;font-weight:600}
#atual{opacity:.95}
.wrap{padding:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#fff;border-radius:16px;padding:16px 14px;box-shadow:0 2px 10px rgba(15,23,42,.06);border-left:5px solid #cbd5e1;min-height:96px;display:flex;flex-direction:column;justify-content:center}
.card.red{border-left-color:#dc2626}.card.grn{border-left-color:#16a34a}.card.blue{border-left-color:var(--b1)}.card.org{border-left-color:#ea580c}
.card .c-l{font-size:12.5px;color:#64748b;font-weight:600;margin-bottom:6px}
.card .c-v{font-size:22px;font-weight:800;letter-spacing:-.5px;line-height:1.05}
.card .c-s{font-size:11px;margin-top:6px;font-weight:700;color:#475569}
.card.grn .c-s{color:#16a34a}.card.red .c-s{color:#dc2626}
.sec{margin-top:22px}
.sec h2{font-size:15px;font-weight:800;color:var(--b2);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sec h2:before{content:'';width:5px;height:18px;background:var(--y1);border-radius:3px}
.panel{background:#fff;border-radius:16px;padding:6px 4px;box-shadow:0 2px 10px rgba(15,23,42,.06)}
.row{display:flex;align-items:center;gap:10px;padding:12px 12px;border-bottom:1px solid #f1f5f9}
.row:last-child{border-bottom:none}
.r-pos{width:26px;height:26px;flex:0 0 26px;background:var(--b1);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.r-nm{flex:1;font-weight:600;font-size:14px}
.r-v{font-weight:800;font-size:14px}
.r-p{font-weight:800;font-size:12px;padding:3px 8px;border-radius:12px;min-width:64px;text-align:center}
.r-p.bad{background:#fee2e2;color:#dc2626}.r-p.good{background:#dcfce7;color:#16a34a}
.mrow{padding:11px 12px;border-bottom:1px solid #f1f5f9}.mrow:last-child{border-bottom:none}
.m-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.bar{height:8px;background:#eef2f7;border-radius:6px;overflow:hidden}
.bar-in{height:100%;background:linear-gradient(90deg,var(--b1),var(--y1));border-radius:6px}
.empty{padding:20px;text-align:center;color:#94a3b8;font-size:13px}
.filters{display:flex;gap:10px;margin-bottom:14px}
.fgroup{flex:1;min-width:0}
.msf{position:relative}
.ms-btn{width:100%;display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid #e2e8f0;border-radius:14px;padding:13px 12px;font-family:inherit;font-size:13px;font-weight:700;color:var(--b2);cursor:pointer;box-shadow:0 2px 8px rgba(15,23,42,.05)}
.ms-ic{font-size:15px}
.ms-lb{flex:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ms-ar{color:#94a3b8;font-size:12px}
.ms-pop{display:none;position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:50;background:#fff;border:1px solid #e2e8f0;border-radius:14px;box-shadow:0 12px 34px rgba(15,23,42,.2);max-height:60vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.ms-pop.open{display:block}
.ms-pop .ms-all{display:flex;align-items:center;gap:9px;padding:13px 14px;font-weight:800;color:var(--b1);border-bottom:1px solid #eef2f7;font-size:13.5px}
.ms-pop .ms-list label{display:flex;align-items:center;gap:9px;padding:12px 14px;font-size:13.5px;font-weight:600;color:#334155;border-bottom:1px solid #f4f6fa}
.ms-pop .ms-list label:last-child{border-bottom:none}
.ms-pop input[type=checkbox]{width:18px;height:18px;accent-color:var(--b1);flex:0 0 18px}
.r-p.neu{background:#eef2f7;color:#475569}
.fab{position:fixed;left:14px;right:14px;bottom:14px;z-index:40;display:flex;gap:10px}
.fab button{flex:1;border:none;border-radius:14px;padding:15px;font-size:14px;font-weight:800;font-family:inherit;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.fab .desk{background:var(--y1);color:var(--b2)}
.fab .out{background:#fff;color:#475569;border:1.5px solid #e2e8f0;flex:0 0 88px}
#loginOv{position:fixed;inset:0;background:linear-gradient(135deg,var(--b2),var(--b1));z-index:100;display:flex;align-items:center;justify-content:center;padding:24px}
.lgbox{background:#fff;border-radius:20px;padding:28px 22px;width:100%;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.lgbox img{height:46px;display:block;margin:0 auto 14px}
.lgbox h1{font-size:19px;text-align:center;color:var(--b2);margin-bottom:4px}
.lgbox p{font-size:12.5px;text-align:center;color:#64748b;margin-bottom:20px}
.lgbox label{font-size:12px;font-weight:700;color:#475569;display:block;margin-bottom:5px}
.lgbox input{width:100%;padding:14px;font-size:15px;border:1.5px solid #e2e8f0;border-radius:12px;margin-bottom:14px;font-family:inherit}
.lgbox input:focus{outline:none;border-color:var(--b1)}
.lgbox button{width:100%;padding:15px;background:var(--b1);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:800;font-family:inherit;cursor:pointer}
#lgErr{color:#dc2626;font-size:12.5px;text-align:center;min-height:16px;margin-top:8px;font-weight:600}
</style>
</head>

var CUR=null;
function fmt(v){if(v==null||isNaN(v))return'R$ 0,00';var s=Math.abs(v).toFixed(2).replace('.',',');var p=s.split(',');p[0]=p[0].replace(/(\d)(?=(\d{3})+(?!\d))/g,'$1.');return(v<0?'-R$ ':'R$ ')+p[0]+','+p[1];}
function fp(v){if(v==null||isNaN(v))return'0,00%';return Number(v).toFixed(2).replace('.',',')+'%';}
function fmtD(d){if(!d)return'-';var s=String(d).substring(0,10).split('-');return s.length===3?s[2]+'/'+s[1]+'/'+s[0]:d;}
function normLogin(s){return String(s||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');}
function redeDaLoja(li){for(var i=0;i<RES.cad.length;i++){if(RES.cad[i][0]===li)return RES.cad[i][1];}return -1;}
function doLogin(){var u=document.getElementById('lgUser').value;var p=document.getElementById('lgPass').value;var nu=normLogin(u);var f=null;for(var i=0;i<USERS.length;i++){if(normLogin(USERS[i].u)===nu&&USERS[i].p===p){f=USERS[i];break;}}if(!f){document.getElementById('lgErr').textContent='Usu\u00e1rio ou senha inv\u00e1lidos.';return;}document.getElementById('lgErr').textContent='';document.getElementById('lgPass').value='';startSession(f);}
function startSession(user){CUR=user;try{sessionStorage.setItem('dogsUser',JSON.stringify(user));}catch(e){}var ov=document.getElementById('loginOv');if(ov)ov.style.display='none';buildFilters();render();}
function logout(){try{sessionStorage.removeItem('dogsUser');}catch(e){}location.reload();}
function irDesktop(){try{localStorage.setItem('pref_view','desktop');}catch(e){}location.href='index.html?view=desktop';}
function podeVerVenda(){return !CUR||CUR.role!=='loja';}
function scopeLojas(){var idxs=[];if(!CUR||CUR.role==='all'){for(var i=0;i<RES.lojas.length;i++)idxs.push(i);}else if(CUR.role==='rede'){var reds=CUR.redes||[];for(var i=0;i<RES.lojas.length;i++){if(reds.indexOf(redeDaLoja(i))>=0)idxs.push(i);}}else if(CUR.role==='loja'){idxs.push(CUR.loja);}return idxs;}

  cards+=cardHTML('Rebaixa',fmt(rb),'org','');
  document.getElementById('kpis').innerHTML=cards;
  var la=lojas.map(function(li){var o=perL[li]||{q:0,v:0};var p=o.v?(o.q/o.v*100):0;return{li:li,q:o.q,p:p,dm:p-RES.meta};});
  la.sort(function(a,b){return b.dm-a.dm;});
  var lh='';la.slice(0,5).forEach(function(r,i){lh+=rowHTML(i+1,RES.lojas[r.li],fmt(r.q),fp(r.p),r.dm>0);});
  document.getElementById('topLojas').innerHTML=lh||'<div class="empty">Sem dados</div>';
  var ma=Object.keys(mot).map(function(k){return{k:parseInt(k),v:mot[k]};});
  ma.sort(function(a,b){return b.v-a.v;});
  var mh='';var mtot=q||1;ma.slice(0,5).forEach(function(r,i){var pp=r.v/mtot*100;mh+=motHTML(i+1,RES.mq[r.k]||'-',fmt(r.v),pp);});
  document.getElementById('topMot').innerHTML=mh||'<div class="empty">Sem dados</div>';
  var pAgg={},fAgg={};
  RES.q.forEach(function(row){var li=row[0];if(!inSc[li])return;var mi=row[1];if(mi!==-1&&!miSet[mi])return;if(row[2]>=0)pAgg[row[2]]=(pAgg[row[2]]||0)+row[4];if(row[3]>=0)fAgg[row[3]]=(fAgg[row[3]]||0)+row[4];});
  var pa=Object.keys(pAgg).map(function(k){return{k:parseInt(k),v:pAgg[k]};});pa.sort(function(a,b){return b.v-a.v;});
  var pth=q||1;var ph='';pa.slice(0,8).forEach(function(r,i){ph+=prodHTML(i+1,RES.pn[r.k]||'-',fmt(r.v),r.v/pth*100);});
  document.getElementById('topProd').innerHTML=ph||'<div class="empty">Sem dados</div>';
  var fa=Object.keys(fAgg).map(function(k){return{k:parseInt(k),v:fAgg[k]};});fa.sort(function(a,b){return b.v-a.v;});
  var fh='';fa.slice(0,8).forEach(function(r,i){fh+=prodHTML(i+1,RES.fn[r.k]||'-',fmt(r.v),r.v/pth*100);});
  document.getElementById('topForn').innerHTML=fh||'<div class="empty">Sem dados</div>';
  var SI=sacIni();var store=sacLoad();var pend=0,est=0,val=0;
  RES.sac.forEach(function(s){if(!inSc[s[0]])return;if(s[1]<SI)return;var sm=String(s[1]).substring(0,7);if(!mstr[sm])return;var rec=store[s[3]]||{};var c=sacCode(s[1],rec.pago);if(c!=='pago'){pend++;val+=s[2];if(c==='est')est++;}});
  document.getElementById('sac').innerHTML=cardHTML('SAC Pendentes',String(pend),'org','')+cardHTML('SAC Estourados (>45d)',String(est),est>0?'red':'grn','')+cardHTML('Valor Pendente SAC',fmt(val),val>0?'red':'grn','');
  var CI=sacIni();var cstore=contamLoad();var cpend=0,cest=0,cval=0;
  RES.contam.forEach(function(s){if(!inSc[s[0]])return;if(s[1]<CI)return;var sm=String(s[1]).substring(0,7);if(!mstr[sm])return;var rec=cstore[s[3]]||{};var c=sacCode(s[1],rec.pago);if(c!=='pago'){cpend++;cval+=s[2];if(c==='est')cest++;}});
  document.getElementById('contam').innerHTML=cardHTML('Contaminados Pendentes',String(cpend),'org','')+cardHTML('Contaminados Estourados (>45d)',String(cest),cest>0?'red':'grn','')+cardHTML('Valor Pendente Contaminados',fmt(cval),cval>0?'red':'grn','');
}
document.addEventListener('DOMContentLoaded',function(){var sv=null;try{sv=JSON.parse(sessionStorage.getItem('dogsUser')||'null');}catch(e){}if(sv&&sv.u){startSession(sv);}});

</script>
